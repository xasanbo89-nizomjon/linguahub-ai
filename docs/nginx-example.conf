# LinguaHub AI - example Nginx reverse-proxy configuration (Phase 11).
#
# This is DOCUMENTATION ONLY - a config example for whoever sets up a real
# reverse proxy at deploy time. It is not deployed, tested against a real
# Nginx instance, or referenced by any running code in this project. No
# real domain is hardcoded - replace app.example.com and the upstream
# address with real values.
#
# See docs/production-sse-proxy.md and docs/production-network-and-cors.md
# for the reasoning behind every non-obvious directive below.

# Plain HTTP: redirect everything to HTTPS. Real production traffic should
# never be served over plain HTTP - see docs/production-security.md for
# the HSTS header this app already sends once you're on HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.example.com;

    # TLS termination happens HERE, at the reverse proxy - server.js itself
    # speaks plain HTTP and is never directly exposed to the Internet.
    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Matches this app's own express.json({ limit: "10mb" }) - a proxy
    # limit smaller than the application's own would reject a legitimate
    # request before it ever reaches server.js's own (already-tested)
    # 413 handling.
    client_max_body_size 10m;

    # --- Real-time streaming route (POST /api/chat/stream): the settings
    # that actually matter for SSE - see docs/production-sse-proxy.md for
    # why each of these exists.
    location /api/chat/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # The single most important line for this route: without it,
        # Nginx buffers the entire response before forwarding any of it,
        # silently turning a real-time stream into "wait, then get it all
        # at once."
        proxy_buffering off;
        proxy_cache off;

        # Longer than the longest AI mode timeout (Deep Thinking: 90s in
        # lib/aiModes.js) - a default ~60s proxy read timeout would cut
        # the connection before this app's own honest timeout message can
        # ever be sent.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Real client IP forwarding - required for TRUST_PROXY=1-aware
        # rate limiting (docs/production-network-and-cors.md) to key by
        # the real client, not this proxy's own address.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Preserve the Connection header server.js sets itself
        # (keep-alive) instead of Nginx's own default of rewriting it.
        proxy_set_header Connection "";
    }

    # --- Everything else (chat's non-streaming variant, static assets,
    # health checks, auth): normal proxying, no special SSE handling
    # needed.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # No caching of private API responses - most routes here are
        # either dynamic API calls or the app shell itself
        # (index.html, already sent with Cache-Control: no-cache by
        # server.js - see docs/production-environment.md's static asset
        # section). This directive is redundant with that application-side
        # header for /api/* specifically, but is set here too rather than
        # assumed, since intermediate caches don't always honor
        # application-set Cache-Control uniformly.
        proxy_no_cache 1;
    }

    # Liveness/readiness probes (docs/production-healthchecks.md) - no
    # special handling needed beyond normal proxying; listed separately
    # only for clarity on what an orchestrator should point its probes at.
    location = /live {
        proxy_pass http://127.0.0.1:3000;
    }
    location = /ready {
        proxy_pass http://127.0.0.1:3000;
    }
}
